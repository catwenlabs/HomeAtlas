server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Same-origin API proxy: the browser only ever talks to this origin.
    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        client_max_body_size 20m;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        # No "$uri/" here: vite's dist has a real "assets/" directory, and
        # matching it would 301 the /assets ROUTE away (losing the port on
        # the redirect) — a hard refresh on the assets page then dies.
        try_files $uri /index.html;
        # SPA fallback serves index.html — never let browsers cache it stale,
        # otherwise they keep running an old bundle against a migrated API.
        add_header Cache-Control "no-cache";
    }
}
